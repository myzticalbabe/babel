name: Soul Forge Gate
on: [pull_request]
jobs:
  soul-forge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Soul Forge Inclusion Audit
        uses: ./.github/actions/audit-inclusion
        with:
          path: '.'
          fail-on: 'high'
      - name: Soul Forge Accessibility Audit
        uses: ./.github/actions/audit-accessibility
        with:
          path: '.'
          fail-on: 'high'